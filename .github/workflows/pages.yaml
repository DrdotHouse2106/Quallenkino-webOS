name: Quallenkino webOS / YouTube-Seite (GitHub Pages)

# Die App läuft auf dem Fernseher unter file://; YouTube bettet dort nicht ein (Fehler 153).
# Deshalb liegt die kleine Player-Seite site/yt.html auf GitHub Pages (echte https-Adresse).
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
