name: Quallenkino webOS / GitHub Pages (YouTube-Seite, Homebrew-Quelle)

# Die App läuft auf dem Fernseher unter file://; YouTube bettet dort nicht ein (Fehler 153).
# Deshalb liegt die kleine Player-Seite site/yt.html auf GitHub Pages (echte https-Adresse).
# Dazu die Paketquelle für den Homebrew Channel (homebrew/apps.json), erzeugt aus dem neuesten Release.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yaml']
  # Nach jedem Build auf main (ein neues Release kommt aus diesem Workflow)
  workflow_run:
    workflows: ['Quallenkino webOS / Build']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Homebrew-Quelle aus dem neuesten Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://drdothouse2106.github.io/Quallenkino-webOS/homebrew"
          mkdir -p site/homebrew
          cp assets/quallenkino-icon-320.png site/homebrew/icon.png
          tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          version="${tag#v}"
          gh release download "$tag" --repo "$REPO" --pattern 'quallenkino-webos.ipk' --dir /tmp/ipk --clobber
          sha=$(sha256sum /tmp/ipk/quallenkino-webos.ipk | cut -d' ' -f1)
          ipk="https://github.com/$REPO/releases/download/$tag/quallenkino-webos.ipk"
          jq -n --arg v "$version" --arg ipk "$ipk" --arg sha "$sha" --arg icon "$base/icon.png" '{
            id: "de.drdothouse.quallenkino", version: $v, type: "web", title: "Quallenkino",
            appDescription: "Jellyfin-Client für den Fernseher",
            iconUri: $icon, sourceUrl: "https://github.com/DrdotHouse2106/Quallenkino-webOS",
            rootRequired: false, ipkUrl: $ipk, ipkHash: { sha256: $sha }
          }' > site/homebrew/quallenkino.manifest.json
          jq -n --arg icon "$base/icon.png" --arg manifest "$base/quallenkino.manifest.json" --slurpfile m site/homebrew/quallenkino.manifest.json '{
            paging: { page: 1, count: 1, maxPage: 1, itemsTotal: 1 },
            packages: [{
              id: "de.drdothouse.quallenkino", title: "Quallenkino", iconUri: $icon,
              manifestUrl: $manifest, category: "multimedia", pool: "main",
              shortDescription: "Jellyfin-Client für den Fernseher", manifest: $m[0]
            }]
          }' > site/homebrew/apps.json
          cat site/homebrew/apps.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5