name: Quallenkino webOS / Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release v{Version aus package.json} anlegen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build

      - name: IPK packen
        run: |
          npx ares-package dist -o out
          VERSION=$(node -p "require('./package.json').version")
          IPK=$(ls out/*.ipk | head -1)
          cp "$IPK" "out/quallenkino-webos-v${VERSION}.ipk"
          cp "$IPK" out/quallenkino-webos.ipk
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Samsung (Tizen): unsigniertes .wgt – signiert wird auf dem PC mit dem eigenen Samsung-Zertifikat (README)
      - name: Tizen bauen und packen
        run: |
          npm run build:tizen
          (cd dist-tizen && zip -qr "../out/quallenkino-tizen-v${VERSION}.wgt" .)
          cp "out/quallenkino-tizen-v${VERSION}.wgt" out/quallenkino-tizen.wgt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quallenkino-webos-${{ env.VERSION }}
          path: |
            out/quallenkino-webos-v*.ipk
            out/quallenkino-tizen-v*.wgt

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^## ${VERSION}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)
          gh release create "v${VERSION}" out/quallenkino-webos-v${VERSION}.ipk out/quallenkino-webos.ipk \
            out/quallenkino-tizen-v${VERSION}.wgt out/quallenkino-tizen.wgt \
            --title "Quallenkino webOS ${VERSION}" --notes "${NOTES:-Quallenkino webOS ${VERSION}}"
